name: Apply HelperProfiles Alpha 2 source

on:
  pull_request:
    branches:
      - automation/alpha2-source-base

permissions:
  contents: write

jobs:
  apply-alpha2:
    if: github.head_ref == 'feature/expanded-helper-roster'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and extract Alpha 2 payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap/alpha2 -maxdepth 1 -name '*.part' -type f | wc -l)" -eq 6
          cat > /tmp/hp-alpha2-parts.sha256 <<'EOF'
          cfd587aeacf75f2d64e15c0965d99e7b05ed37926d53d879b70130edca94d182  .bootstrap/alpha2/000.part
          5a20ef717f1b38da6754ea6e35d2b3d831a88473180956c4234a96e13b25fa7e  .bootstrap/alpha2/001.part
          e9923948b819cd04a3b15f1f3c2f4d839fbd4b8e27d093027c2acf24799aa8f0  .bootstrap/alpha2/002.part
          143036e033f990fdb6bdcf9a81639c79fdf3a5637538ad4e9472dea325bf0f8b  .bootstrap/alpha2/003.part
          4f0435f32b12f989b878e8123c0f93cb17b67fa169731ff94e5cb6adfe2cd288  .bootstrap/alpha2/004.part
          56bbb077d174a9f8903ab43f8ab80a593d48f9209bd3f8599966820297b595ce  .bootstrap/alpha2/005.part
          EOF
          sed -i 's/^          //' /tmp/hp-alpha2-parts.sha256
          sha256sum -c /tmp/hp-alpha2-parts.sha256

          cat .bootstrap/alpha2/*.part | base64 --decode > /tmp/hp-alpha2.tar.xz
          echo '2340a7c413feedd0add74de01e60b9c267666782b685680fff00277718e3b6af  /tmp/hp-alpha2.tar.xz' | sha256sum -c -
          tar -tJf /tmp/hp-alpha2.tar.xz
          tar -xJf /tmp/hp-alpha2.tar.xz

          cat > /tmp/hp-alpha2.sha256 <<'EOF'
          b3603fac8ac1c38b5771b01740097f839894f8591db818062bec0f28c1b5314a  modDesc.xml
          36f9939b478d1bc5702f7da753e8040794655db9c356ce0c240023e17322c9b7  scripts/HP_Compatibility.lua
          223533f402d6af5b12601c55d7ff52b53ce0bee6209fb66cd195c5de9a64036c  scripts/gui/HP_AppearanceBindingsScreen.lua
          a744d4bb08f8a8560cc0b944f6e4c8ac18350f7ca4388ee160031c1a68277ce1  scripts/RegisterPlayerActionEvents.lua
          9809d2b9db18aebe90be69cca5c8c05cdd4f15528fe15bb586b9cab32561cb11  scripts/HelperProfiles.lua
          d43afa6987b6da849a0c0a7f673746ccd3ba0bb7cf6e3350b2a3282e3e8ecd58  scripts/HP_UI.lua
          39561a0ec8aa7c6c2562145a456fd6662f425b5f2f799cc8781ebf10602e4cfa  scripts/HP_WorkerAppearance.lua
          be8c66ccece9914b511ba3cc6cda69d37d11af88d57be3ee09c635314d4d7bbc  scripts/HP_AppearanceMenu.lua
          9573c4cc92c74fe15f50d27dd15f7a6661c650dd388c42aef40913d75eecf6d3  scripts/HP_RosterExpansion.lua
          fc9370604696ee47932e3372eb563eccb8d55e371f6252fa9b00c90b2cb4f4d7  l10n/l10n_en.xml
          4898f48b65dc1e85a99d043f9ec98cd48cbab7330cf7de111fef856c2604e5da  l10n/l10n_de.xml
          2666c22c42fa4e25029e133643b87cb0ce09de00f1b54d497361db6d10a8a1bd  l10n/l10n_fr.xml
          EOF
          sed -i 's/^          //' /tmp/hp-alpha2.sha256
          sha256sum -c /tmp/hp-alpha2.sha256

          ! grep -R -n --binary-files=without-match -E '✅|❌' scripts/RegisterPlayerActionEvents.lua
          grep -q 'HiredHelperTool' scripts/HP_Compatibility.lua
          grep -q 'isSelectedHelperActive' scripts/gui/HP_AppearanceBindingsScreen.lua
          grep -q 'ACTIVE / READ-ONLY' scripts/gui/HP_AppearanceBindingsScreen.lua
          grep -q 'HP_Compatibility.lua' modDesc.xml

      - name: Commit exact Alpha 2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/apply-alpha2-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Prepare HelperProfiles 2.1.0.0 Alpha 2'
          git push origin HEAD:${{ github.head_ref }}
