name: Build HelperProfiles API v7 Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-api-v7-test.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Farming Simulator test package
        shell: bash
        run: |
          set -euo pipefail
          rm -f FS25_HelperProfiles_APIv7_test.zip
          zip -r FS25_HelperProfiles_APIv7_test.zip \
            modDesc.xml \
            icon_helperProfiles.dds \
            gui \
            l10n \
            scripts \
            -x '*.DS_Store' '*__MACOSX*'

          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET

          package = 'FS25_HelperProfiles_APIv7_test.zip'
          with zipfile.ZipFile(package, 'r') as archive:
              names = set(archive.namelist())
              required = {
                  'modDesc.xml',
                  'scripts/HelperProfiles.lua',
                  'scripts/HP_IntegrationAPI.lua',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing required package files: {missing}')
              ET.fromstring(archive.read('modDesc.xml'))
          PY

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: FS25_HelperProfiles_APIv7_test
          path: FS25_HelperProfiles_APIv7_test.zip
          retention-days: 7
