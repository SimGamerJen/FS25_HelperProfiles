name: Import HelperProfiles source

on:
  push:
    branches:
      - feature/helperpayroll-role-ui
    paths:
      - .github/workflows/import-helperprofiles-source.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download released 2.0.26.0 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/helperprofiles-release
          gh release download 2.0.26.0-beta \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' \
            --dir /tmp/helperprofiles-release
          BASE_ZIP="$(find /tmp/helperprofiles-release -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$BASE_ZIP"
          rm -rf gui l10n scripts
          rm -f modDesc.xml icon_helperProfiles.dds helperprofiles.dds
          unzip -q "$BASE_ZIP" -d .

      - name: Decode and verify current-source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/patch.tar.xz.b64.* | base64 --decode > /tmp/helperprofiles-patch.tar.xz
          echo "1be3e41367c820a306b14e78573bd4806da13b8c01be10ad4638126d1ead7164  /tmp/helperprofiles-patch.tar.xz" | sha256sum --check -
          tar -xJf /tmp/helperprofiles-patch.tar.xz -C .

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/import-helperprofiles-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add HelperPayroll role integration"
          git push
