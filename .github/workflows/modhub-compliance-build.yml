name: Build HelperProfiles ModHub compliance candidate

on:
  push:
    branches:
      - agent/modhub-publiclua-0.9.21
    paths:
      - .github/workflows/modhub-compliance-build.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compliance branch
        uses: actions/checkout@v4
        with:
          ref: agent/modhub-publiclua-0.9.21

      - name: Install Lua syntax checker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 >/dev/null

      - name: Validate Lua and ModHub compliance changes
        shell: bash
        run: |
          set -euo pipefail
          find scripts -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          wrapper = Path('scripts/HP_ProtectedCall.lua')
          if not wrapper.exists():
              raise SystemExit('Missing HP_ProtectedCall.lua')
          wrapper_text = wrapper.read_text(encoding='utf-8')
          for marker in ['pcall(fn, ...)', 'if not ok then', 'logFailure(a)']:
              if marker not in wrapper_text:
                  raise SystemExit('Protected-call wrapper missing marker: ' + marker)

          direct = []
          long_lines = []
          for path in sorted(Path('scripts').rglob('*.lua')):
              text = path.read_text(encoding='utf-8')
              if path != wrapper:
                  for n, line in enumerate(text.splitlines(), 1):
                      if 'pcall(' in line or 'xpcall(' in line:
                          direct.append(f'{path}:{n}')
              for n, line in enumerate(text.splitlines(), 1):
                  if len(line) > 200:
                      long_lines.append(f'{path}:{n}:{len(line)}')
          if direct:
              raise SystemExit('Direct protected calls remain outside wrapper: ' + ', '.join(direct))
          if long_lines:
              raise SystemExit('Lua lines over 200 chars remain: ' + ', '.join(long_lines))

          root = ET.parse('modDesc.xml').getroot()
          if root.attrib.get('descVersion') != '113':
              raise SystemExit('Expected descVersion 113')
          if root.findtext('version') != '2.1.1.0':
              raise SystemExit('Expected mod version 2.1.1.0')
          multiplayer = root.find('multiplayer')
          if multiplayer is None or multiplayer.attrib.get('supported') != 'false':
              raise SystemExit('Multiplayer flag changed unexpectedly')
          sources = [node.attrib.get('filename') for node in root.findall('./extraSourceFiles/sourceFile')]
          if not sources or sources[0] != 'scripts/HP_ProtectedCall.lua':
              raise SystemExit('HP_ProtectedCall.lua must load first')
          for wanted in [
              'scripts/HP_AutoDriveContinuity.lua',
              'scripts/HP_AutoDrivePayrollBridge.lua',
              'scripts/HP_HelperAcquisitionRouter.lua',
              'scripts/HP_IntegrationAPI.lua',
          ]:
              if wanted not in sources:
                  raise SystemExit('Missing source file: ' + wanted)
          print('Static compliance candidate validation passed')
          PY

      - name: Build ModHub candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f FS25_HelperProfiles.zip
          zip -r FS25_HelperProfiles.zip modDesc.xml icon_helperProfiles.dds gui l10n scripts -x '*.DS_Store' '*__MACOSX*'
          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          with zipfile.ZipFile('FS25_HelperProfiles.zip', 'r') as archive:
              names = set(archive.namelist())
              required = {
                  'modDesc.xml',
                  'icon_helperProfiles.dds',
                  'scripts/HP_ProtectedCall.lua',
                  'scripts/HP_AutoDriveContinuity.lua',
                  'scripts/HP_AutoDrivePayrollBridge.lua',
                  'scripts/HP_HelperAcquisitionRouter.lua',
                  'scripts/HP_IntegrationAPI.lua',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Missing packaged files: ' + ', '.join(missing))
              root = ET.fromstring(archive.read('modDesc.xml'))
              if root.attrib.get('descVersion') != '113' or root.findtext('version') != '2.1.1.0':
                  raise SystemExit('Unexpected packaged metadata')
          PY

      - name: Upload test candidate
        uses: actions/upload-artifact@v4
        with:
          name: FS25_HelperProfiles-2.1.1.0-TestRunner-0.9.21
          path: FS25_HelperProfiles.zip
          if-no-files-found: error
          retention-days: 7
