name: Apply HelperProfiles ModHub long-line cleanup

on:
  push:
    branches:
      - agent/modhub-publiclua-0.9.21
    paths:
      - .github/workflows/modhub-longline-fix.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compliance branch
        uses: actions/checkout@v4
        with:
          ref: agent/modhub-publiclua-0.9.21
          fetch-depth: 0

      - name: Split reported long Lua lines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'scripts/HP_ASBridge.lua': [
                  (
                      '    setXMLString(xmlFile, "helperProfilesAppearance#note", "Per-save helper appearance links. Bind helper names to AvatarSwitcher preset IDs. Use the HP appearance menu or hpAppearance bind <helperIndex> <presetId>. Category is stored as metadata/legacy fallback. displayName is derived from the bound AvatarSwitcher preset and used by the HP overlay/menu.")',
                      '''    setXMLString(\n        xmlFile,\n        "helperProfilesAppearance#note",\n        "Per-save helper appearance links. Bind helper names to AvatarSwitcher preset IDs. " ..\n        "Use the HP appearance menu or hpAppearance bind <helperIndex> <presetId>. " ..\n        "Category is stored as metadata/legacy fallback. displayName is derived from the bound " ..\n        "AvatarSwitcher preset and used by the HP overlay/menu."\n    )'''
                  ),
                  (
                      '    hpPrint("Loaded. Appearance provider available=" .. tostring(self:isAvailable()) .. " | api=" .. tostring(self:isApiAvailable()) .. " | global=" .. tostring(_G ~= nil and _G.AvatarSwitcherAPI ~= nil) .. " | direct=" .. tostring(directOk) .. " | directPresetCount=" .. tostring(#(self.directPresets or {})) .. " | savegame=" .. tostring(self.savegameName) .. " | linksFile=" .. tostring(self.linksFile))',
                      '''    hpPrint(\n        "Loaded. Appearance provider available=" .. tostring(self:isAvailable()) ..\n        " | api=" .. tostring(self:isApiAvailable()) ..\n        " | global=" .. tostring(_G ~= nil and _G.AvatarSwitcherAPI ~= nil) ..\n        " | direct=" .. tostring(directOk) ..\n        " | directPresetCount=" .. tostring(#(self.directPresets or {})) ..\n        " | savegame=" .. tostring(self.savegameName) ..\n        " | linksFile=" .. tostring(self.linksFile)\n    )'''
                  ),
              ],
              'scripts/HP_Compatibility.lua': [
                  (
                      '        print(LOG .. "HelperProfiles disabled for this session: incompatible helper-roster owner detected (" .. self.conflictMod .. ", source=" .. self.conflictSource .. "). Disable either HelperProfiles or Hired Helper Tool and reload the save.")',
                      '''        print(\n            LOG .. "HelperProfiles disabled for this session: incompatible helper-roster owner detected (" ..\n            self.conflictMod .. ", source=" .. self.conflictSource ..\n            "). Disable either HelperProfiles or Hired Helper Tool and reload the save."\n        )'''
                  ),
              ],
              'scripts/HP_Debug.lua': [
                  (
                      '        print("[HP] hpAppearance status | menu | reload | refresh | debug | cycle [delta] | bind <helperIndex> <presetId> | unbind <helperIndex> | clear | bindLegacy <helperIndex> <category> [presetId]")',
                      '''        print(\n            "[HP] hpAppearance status | menu | reload | refresh | debug | cycle [delta] | " ..\n            "bind <helperIndex> <presetId> | unbind <helperIndex> | clear | " ..\n            "bindLegacy <helperIndex> <category> [presetId]"\n        )'''
                  ),
                  (
                      '                print(("[HP] %02d %s%s | preset=%s | category=%s | label=%s"):format(i, tostring(displayName), slotSuffix, tostring(presetId or "?"), tostring(category or "?"), tostring(label or "?")))',
                      '''                print(("[HP] %02d %s%s | preset=%s | category=%s | label=%s"):format(\n                    i,\n                    tostring(displayName),\n                    slotSuffix,\n                    tostring(presetId or "?"),\n                    tostring(category or "?"),\n                    tostring(label or "?")\n                ))'''
                  ),
                  (
                      '        print(("[HP] Bound %s (%s) -> AS preset \'%s\' | category=%s | label=%s"):format(tostring(displayName), tostring(helper.name or idx), tostring(res.id or presetId), tostring(res.category or "?"), tostring(res.name or res.id or presetId)))',
                      '''        print(("[HP] Bound %s (%s) -> AS preset '%s' | category=%s | label=%s"):format(\n            tostring(displayName),\n            tostring(helper.name or idx),\n            tostring(res.id or presetId),\n            tostring(res.category or "?"),\n            tostring(res.name or res.id or presetId)\n        ))'''
                  ),
              ],
              'scripts/HP_WorkerAppearance.lua': [
                  (
                      '        self:debug("Applied " .. tostring(preset and preset.id or "preset") .. " to " .. self:getVehicleName(vehicle) .. " | helper=" .. tostring(helper and helper.name or "?") .. " | reason=" .. tostring(reason))',
                      '''        self:debug(\n            "Applied " .. tostring(preset and preset.id or "preset") ..\n            " to " .. self:getVehicleName(vehicle) ..\n            " | helper=" .. tostring(helper and helper.name or "?") ..\n            " | reason=" .. tostring(reason)\n        )'''
                  ),
              ],
              'scripts/gui/HP_AppearanceBindingsScreen.lua': [
                  (
                      '        table.insert(self.helperRows, { index = 1, slot = "A", helper = nil, name = hpI18n("hp_helper_fallback", "Helper 1"), displayName = hpI18n("hp_no_helpers_available", "No helpers available"), label = hpI18n("hp_no_helpers_available", "No helpers available") })',
                      '''        table.insert(self.helperRows, {\n            index = 1,\n            slot = "A",\n            helper = nil,\n            name = hpI18n("hp_helper_fallback", "Helper 1"),\n            displayName = hpI18n("hp_no_helpers_available", "No helpers available"),\n            label = hpI18n("hp_no_helpers_available", "No helpers available")\n        })'''
                  ),
                  (
                      '        detail = hpFormat("hp_detail_selected", "Selected: %s  |  %s  |  %s [%s]", tostring(helperRow.displayName or helperRow.name), tostring(category or "-"), tostring(presetRow.label or presetRow.id), tostring(presetRow.id))',
                      '''        detail = hpFormat(\n            "hp_detail_selected",\n            "Selected: %s  |  %s  |  %s [%s]",\n            tostring(helperRow.displayName or helperRow.name),\n            tostring(category or "-"),\n            tostring(presetRow.label or presetRow.id),\n            tostring(presetRow.id)\n        )'''
                  ),
                  (
                      '        status = status .. "  |  " .. hpFormat("hp_status_current_binding", "Current binding: %s → %s", tostring(helperRow.displayName or helperRow.name), hpI18n("hp_state_unbound_title", "Unbound"))',
                      '''        status = status .. "  |  " .. hpFormat(\n            "hp_status_current_binding",\n            "Current binding: %s → %s",\n            tostring(helperRow.displayName or helperRow.name),\n            hpI18n("hp_state_unbound_title", "Unbound")\n        )'''
                  ),
              ],
          }

          applied = 0
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected long line not found in {filename}: {old[:80]}')
                  text = text.replace(old, new, 1)
                  applied += 1
              path.write_text(text, encoding='utf-8')

          long_lines = []
          for path in sorted(Path('scripts').rglob('*.lua')):
              for n, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if len(line) > 200:
                      long_lines.append(f'{path}:{n}:{len(line)}')
          if long_lines:
              raise SystemExit('Lua lines over 200 chars remain: ' + ', '.join(long_lines))
          if applied != 10:
              raise SystemExit(f'Expected 10 replacements, applied {applied}')
          print('Split all 10 reported long Lua lines')
          PY

      - name: Commit long-line cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          git commit -m "Clean up ModHub Lua long-line warnings"
          git push origin HEAD:agent/modhub-publiclua-0.9.21
