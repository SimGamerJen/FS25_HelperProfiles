name: Apply HelperProfiles PublicLua compliance refactor

on:
  push:
    branches:
      - agent/modhub-publiclua-0.9.21
    paths:
      - .github/workflows/modhub-publiclua-fix.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compliance branch
        uses: actions/checkout@v4
        with:
          ref: agent/modhub-publiclua-0.9.21
          fetch-depth: 0

      - name: Route protected calls through logged wrapper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wrapper = Path('scripts/HP_ProtectedCall.lua')
          if not wrapper.exists():
              raise SystemExit('Missing HP_ProtectedCall.lua')

          changed = []
          replacements = 0
          for path in sorted(Path('scripts').rglob('*.lua')):
              if path == wrapper:
                  continue
              text = path.read_text(encoding='utf-8')
              count = text.count('pcall(')
              if count:
                  text = text.replace('pcall(', 'HP_ProtectedCall.call(')
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
                  replacements += count

          mod_desc = Path('modDesc.xml')
          text = mod_desc.read_text(encoding='utf-8')
          entry = '        <sourceFile filename="scripts/HP_ProtectedCall.lua"/>\n'
          if entry not in text:
              marker = '    <extraSourceFiles>\n'
              if marker not in text:
                  raise SystemExit('Missing extraSourceFiles section')
              text = text.replace(marker, marker + entry, 1)
              mod_desc.write_text(text, encoding='utf-8')

          remaining = []
          for path in sorted(Path('scripts').rglob('*.lua')):
              if path == wrapper:
                  continue
              count = path.read_text(encoding='utf-8').count('pcall(')
              if count:
                  remaining.append(f'{path}:{count}')

          if remaining:
              raise SystemExit('Unrouted pcall calls remain: ' + ', '.join(remaining))
          if replacements < 78:
              raise SystemExit(f'Expected at least 78 protected-call replacements, found {replacements}')

          print(f'Routed {replacements} protected calls across {len(changed)} files')
          for path in changed:
              print(' - ' + path)
          PY

      - name: Commit compliance refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modDesc.xml scripts
          git commit -m "Route protected calls through logged wrapper"
          git push origin HEAD:agent/modhub-publiclua-0.9.21
