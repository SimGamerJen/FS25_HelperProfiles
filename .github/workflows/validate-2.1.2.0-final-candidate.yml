name: Validate final HelperProfiles 2.1.2.0 candidate

on:
  push:
    branches:
      - modhub/2.1.1.0-resubmission

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Validate metadata and links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse('modDesc.xml').getroot()
          assert root.attrib.get('descVersion') == '114'
          assert root.findtext('version') == '2.1.2.0'

          text = Path('modDesc.xml').read_text(encoding='utf-8')
          hp = 'https://github.com/SimGamerJen/FS25_HelperProfiles'
          hpay = 'https://github.com/SimGamerJen/FS25_HelperPayroll'
          if text.count(hp) < 3:
              raise SystemExit('HelperProfiles GitHub link missing from one or more localisations')
          if text.count(hpay) < 3:
              raise SystemExit('HelperPayroll GitHub link missing from one or more localisations')
          if 'KEY_a' in text:
              raise SystemExit('Conflicting KEY_a binding present')

          for path in [
              'gui/HP_AppearanceBindingsScreen.xml',
              'gui/HP_RosterManagerScreen.xml',
              'gui/guiProfiles.xml',
              'l10n/l10n_en.xml',
              'l10n/l10n_de.xml',
              'l10n/l10n_fr.xml',
          ]:
              ET.parse(path)

          for path in Path('scripts').glob('HP_World*.lua'):
              raise SystemExit('Experimental World Workers file present: ' + str(path))
          PY

      - name: Validate Lua syntax
        run: |
          set -euo pipefail
          find scripts -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            luac -p "$file"
          done

      - name: Build candidate
        run: |
          set -euo pipefail
          zip -r FS25_HelperProfiles.zip modDesc.xml icon_helperProfiles.dds gui l10n scripts -x '*.DS_Store' '*__MACOSX*'
          python - <<'PY'
          import zipfile, xml.etree.ElementTree as ET
          with zipfile.ZipFile('FS25_HelperProfiles.zip') as z:
              names=set(z.namelist())
              if any(n.startswith('FS25_HelperProfiles/') for n in names):
                  raise SystemExit('Unexpected wrapper directory')
              root=ET.fromstring(z.read('modDesc.xml'))
              assert root.attrib.get('descVersion') == '114'
              assert root.findtext('version') == '2.1.2.0'
              text=z.read('modDesc.xml').decode('utf-8')
              assert text.count('https://github.com/SimGamerJen/FS25_HelperPayroll') >= 3
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: FS25_HelperProfiles-2.1.2.0-final-candidate
          path: FS25_HelperProfiles.zip
          retention-days: 7
