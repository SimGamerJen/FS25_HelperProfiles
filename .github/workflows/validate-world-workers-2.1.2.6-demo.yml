name: Validate World Workers 2.1.2.6 demo

on:
  push:
    branches:
      - agent/world-workers-alpha6-pedestrian-research

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Validate reconciled development build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse('modDesc.xml').getroot()
          assert root.attrib.get('descVersion') == '115'
          assert root.findtext('version') == '2.1.2.6'

          mod_desc = Path('modDesc.xml').read_text(encoding='utf-8')
          assert 'scripts/HP_PayrollCost.lua' in mod_desc
          assert 'https://github.com/SimGamerJen/FS25_HelperPayroll' in mod_desc
          assert 'input="KEY_a"' not in mod_desc

          roster = Path('gui/HP_RosterManagerScreen.xml').read_text(encoding='utf-8')
          assert 'managementTabs[3]' in roster
          assert 'name="CurrentCost"' in roster

          tabs = Path('scripts/HP_TabbedManagement.lua').read_text(encoding='utf-8')
          assert 'patchWorldScreen' in tabs
          assert 'HP_WorldWorkerGui' in tabs

          slots = Path('scripts/HP_SlotRegistry.lua').read_text(encoding='utf-8')
          for required in [
              'HP_WorldState.lua',
              'HP_WorldWorkerManager.lua',
              'HP_WorldPresence.lua',
              'HP_WorldTargetNavigation.lua',
              'HP_WorldFollow.lua',
          ]:
              assert required in slots, required

          api = Path('scripts/HP_IntegrationAPI.lua').read_text(encoding='utf-8')
          assert 'modVersion = "2.1.2.6"' in api

          assert Path('scripts/HP_PayrollCost.lua').is_file()
          world_files = list(Path('scripts').glob('HP_World*.lua'))
          assert len(world_files) >= 15
          PY

      - name: Validate Lua syntax
        run: |
          set -euo pipefail
          find scripts -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            luac -p "$file"
          done

      - name: Build demo package
        run: |
          set -euo pipefail
          rm -f FS25_HelperProfiles.zip
          zip -r FS25_HelperProfiles.zip modDesc.xml icon_helperProfiles.dds gui l10n scripts -x '*.DS_Store' '*__MACOSX*'
          python - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET
          with zipfile.ZipFile('FS25_HelperProfiles.zip') as z:
              names=set(z.namelist())
              assert not any(n.startswith('FS25_HelperProfiles/') for n in names)
              root=ET.fromstring(z.read('modDesc.xml'))
              assert root.attrib.get('descVersion') == '115'
              assert root.findtext('version') == '2.1.2.6'
              assert 'scripts/HP_PayrollCost.lua' in names
              assert 'scripts/HP_WorldWorkerManager.lua' in names
              assert 'scripts/HP_WorldPresence.lua' in names
              assert 'gui/HP_WorldWorkerScreen.xml' in names
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: FS25_HelperProfiles-2.1.2.6-WorldWorkers-demo
          path: FS25_HelperProfiles.zip
          retention-days: 7
